<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yomi Ajani</title>
<meta name="description" content="Product and Interaction Design based in Berlin by Yomi Ajani">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------
   Tokens
--------------------------------------------- */
:root{
  --bg:      #060606;
  --text:    #f4f3ef;
  --dim:     #8a8a85;
  --line:    rgba(244,243,239,0.16);
  --line-strong: rgba(244,243,239,0.3);

  --font-display: 'Space Grotesk', sans-serif;
  --font-mono:    'IBM Plex Mono', monospace;

  --container: 1600px;
  --pad: 40px;
}

@media (max-width: 640px){ :root{ --pad: 20px; } }

*{ box-sizing: border-box; }
html{ scroll-behavior: smooth; }

body{
  margin:0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

a{ color: inherit; text-decoration: none; }
::selection{ background: rgba(244,243,239,0.25); }

/* ---------------------------------------------
   Nav
--------------------------------------------- */
.nav{
  position: sticky;
  top: 0;
  z-index: 50;
  max-width: var(--container);
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 26px var(--pad);
  background: rgba(6,6,6,0.75);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.06em;
}

.nav-logo{ font-weight: 500; justify-self: start; }

.nav-tagline{
  justify-self: center;
  color: var(--dim);
  text-transform: uppercase;
  white-space: nowrap;
}

.nav-links{ justify-self: end; display: flex; gap: 32px; color: var(--dim); text-transform: uppercase; }
.nav-links a{ transition: color .2s ease; }
.nav-links a:hover{ color: var(--text); }

.nav-toggle{ display:none; flex-direction:column; gap:5px; background:none; border:none; cursor:pointer; padding: 8px; justify-self: end; }
.nav-toggle span{ width:20px; height:1px; background: var(--text); }

@media (max-width: 860px){
  .nav-tagline{ display: none; }
}

@media (max-width: 640px){
  .nav{ grid-template-columns: 1fr auto; }
  .nav-links{
    position:fixed; top:57px; left:0; right:0;
    flex-direction:column; gap:0;
    background: var(--bg);
    max-height: 0; overflow:hidden;
    transition: max-height .3s ease;
  }
  .nav-links.open{ max-height: 200px; }
  .nav-links a{ padding: 16px var(--pad); }
  .nav-toggle{ display:flex; }
}

/* ---------------------------------------------
   Hero — framed video, not fullscreen
--------------------------------------------- */
.hero{
  max-width: var(--container);
  margin: 0 auto;
  padding: 10vh var(--pad) 8vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.hero-frame{
  width: 100%;
  max-width: 1000px;
  margin: 0 auto;
}

.hero-frame-inner{
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: 4px;
  overflow: hidden;
  background: #111;
}

.hero-frame-inner iframe{
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}

.video-placeholder{
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(ellipse at 50% 45%, #333331 0%, #171614 55%, #0a0a0a 100%);
  filter: grayscale(1);
}

.play-btn{
  width: 64px; height: 64px;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  display:flex; align-items:center; justify-content:center;
  font-size: 18px;
  color: var(--text);
  padding-left: 4px;
}

.hero-frame-caption{
  display:flex;
  justify-content: space-between;
  margin-top: 14px;
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--dim);
  text-transform: uppercase;
}

.hero-tag{
  margin: 48px 0 0;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--dim);
}

/* ---------------------------------------------
   Projects — scattered masonry, watermark type
--------------------------------------------- */
.projects{
  position: relative;
  max-width: var(--container);
  margin: 0 auto;
  padding: 18vh var(--pad) 2vh;
}

.projects-watermark{
  position: sticky;
  top: 38vh;
  left: 0;
  width: 100%;
  text-align: center;
  height: 0;
  overflow: visible;
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(64px, 14vw, 200px);
  letter-spacing: -0.02em;
  color: rgba(244,243,239,0.07);
  filter: blur(3px);
  white-space: nowrap;
  z-index: 0;
  pointer-events: none;
  user-select: none;
}

.projects-grid{
  position: relative;
  z-index: 1;
}

.projects-grid.scatter .project-item{
  position: absolute;
  top: 0;
  left: 0;
  will-change: transform;
}

.projects-grid.stacked{
  display: flex;
  flex-direction: column;
  gap: 36px;
}

.project-item{
  display: block;
  cursor: pointer;
}

.project-cover{
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 5; /* fallback if JS ratio assignment doesn't apply */
  border-radius: 2px;
  overflow: hidden;
  background: #151515;
  display: block;
}

.project-cover-art{
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #151515;
  filter: grayscale(1) contrast(1.02);
  transition: filter .5s ease, transform .6s ease;
  transform: scale(1.001);
}

.project-item:hover .project-cover-art,
.project-item.in-focus .project-cover-art{
  filter: grayscale(0) contrast(1.05);
  transform: scale(1.035);
}

.project-badge{
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%) scale(0.9);
  color: var(--text);
  text-shadow: 0 1px 6px rgba(0,0,0,0.5);
  display:flex; align-items:center; justify-content:center;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-align: center;
  opacity: 0;
  transition: opacity .3s ease, transform .3s ease;
  pointer-events: none;
}

.project-item:hover .project-badge,
.project-item.in-focus .project-badge{
  opacity: 1;
  transform: translate(-50%,-50%) scale(1);
}

.project-caption{
  display:flex;
  justify-content: space-between;
  margin-top: 12px;
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--dim);
  transition: color .2s ease;
}

.project-item:hover .project-caption,
.project-item.in-focus .project-caption{ color: var(--text); }

/* ---------------------------------------------
   Contact & footer
--------------------------------------------- */
.contact{
  max-width: var(--container);
  margin: 0 auto;
  padding: 18vh var(--pad) 14vh;
  text-align: center;
}

.contact-eyebrow{
  font-size: 12px;
  letter-spacing: 0.08em;
  color: var(--dim);
  margin: 0 0 24px;
}

.contact-email{
  display:inline-block;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(24px, 4.5vw, 40px);
  letter-spacing: -0.01em;
  padding-bottom: 8px;
  transition: opacity .2s ease;
}
.contact-email:hover{ opacity: 0.6; }

.footer{
  max-width: var(--container);
  margin: 0 auto;
  padding: 24px var(--pad) 40px;
  display:flex;
  flex-wrap: wrap;
  gap: 14px 28px;
  align-items:center;
  justify-content: space-between;
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--dim);
}
.footer a:hover{ color: var(--text); }
.footer-social{ display:flex; gap: 18px; }


/* ---------------------------------------------
   Impressum / Datenschutz
--------------------------------------------- */
.legal{
  max-width: 760px;
  margin: 0 auto;
  padding: 8vh var(--pad) 6vh;
}

.legal h1{
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(24px, 4vw, 34px);
  margin: 0 0 32px;
}

.legal h2{
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 15px;
  margin: 36px 0 12px;
}

.legal p{
  font-size: 14px;
  line-height: 1.7;
  color: var(--dim);
  margin: 0 0 8px;
}
.work-hero{
  max-width: 1000px;
  margin: 0 auto;
  padding: 14vh var(--pad) 6vh;
}

.work-eyebrow{
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--dim);
  margin: 0 0 28px;
}

.work-title{
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(32px, 6vw, 56px);
  letter-spacing: -0.02em;
  line-height: 1.05;
  margin: 0 0 28px;
}

.work-description{
  font-size: 16px;
  line-height: 1.65;
  color: var(--dim);
  margin: 0 0 72px;
}

.work-meta{
  display: flex;
  flex-wrap: wrap;
  gap: 24px;
  padding-top: 0;
}

.meta-cell{ flex: 0 0 auto; display:flex; flex-direction: column; gap: 6px; }
.meta-label{ font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
.meta-value{ font-size: 13px; }
.meta-cell-link{ flex: 1 0 100%; }
.meta-cell-link a{ font-size: 13px; }
.meta-cell-link a:hover{ opacity: 0.6; }

.work-gallery{
  position: relative;
  max-width: 880px;
  margin: 0 auto;
  padding: 12vh var(--pad) 8vh;
}

.work-gallery-item{
  position: absolute;
  top: 0; left: 0;
  display: block;
  border-radius: 2px;
  overflow: hidden;
  will-change: transform;
}
.work-gallery-item img{ width: 100%; height: 100%; object-fit: cover; display:block; }
.work-gallery-empty{ color: var(--dim); font-size: 13px; }

.work-video{
  max-width: 1000px;
  margin: 0 auto;
  padding: 0 var(--pad) 6vh;
}

.work-video-inner{
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: 4px;
  overflow: hidden;
  background: #111;
}

.work-video-iframe{
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}

.work-pagenav{
  max-width: 1000px;
  margin: 40px auto 0;
  padding: 0 var(--pad) 10vh;
  display: flex;
  justify-content: space-between;
  gap: 20px;
  font-size: 13px;
  letter-spacing: 0.02em;
}

.pagenav-link{ color: var(--dim); transition: color .2s ease; }
.pagenav-link:hover{ color: var(--text); }
.pagenav-next{ text-align: right; margin-left: auto; }

/* ---------------------------------------------
   About page
--------------------------------------------- */
.about{
  max-width: 1000px;
  margin: 0 auto;
  padding: 12vh var(--pad) 8vh;
  display: flex;
  gap: 56px;
  align-items: flex-start;
}

.about-portrait{
  flex-shrink: 0;
  width: 260px;
  border-radius: 2px;
  overflow: hidden;
}

.about-portrait.is-placeholder{
  aspect-ratio: 4 / 5;
  background: radial-gradient(circle at 40% 30%, #3a3a37, #0d0d0c 70%);
  filter: grayscale(1);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--dim);
  text-align: center;
  padding: 12px;
}

.about-portrait.has-photo img{ width: 100%; height: auto; display: block; }
.about-portrait.is-placeholder img{ width:100%; height:100%; object-fit: cover; }

.about-intro{ flex: 1; min-width: 0; }

@media (max-width: 760px){
  .about{ flex-direction: column; gap: 32px; }
  .about-portrait{ width: 180px; }
}

.about h1{
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(28px, 5vw, 44px);
  letter-spacing: -0.02em;
  margin: 0 0 24px;
  color: var(--text);
}

.about-bio{
  font-size: 16px;
  line-height: 1.7;
  color: var(--dim);
  max-width: 620px;
  margin: 0 0 20px;
}

.about-section{
  max-width: 1000px;
  margin: 0 auto;
  padding: 5vh var(--pad);
}

.about-section h2{
  font-size: 16px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text);
  margin: 0 0 24px;
}

.about-entries{
  display: flex;
  flex-wrap: wrap;
  gap: 24px 56px;
}

.about-entry{
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 10px 0;
}

.about-entry .role{ font-size: 14px; font-weight: 500; color: #c7c5be; }
.about-entry .org{ font-size: 14px; color: #8f8d87; }
.about-entry .date{ font-size: 14px; color: #75736d; letter-spacing: 0.04em; text-transform: uppercase; }
.about-entry a{ transition: opacity .2s ease; }
.about-entry a:hover{ opacity: 0.6; }

.about-clients-line{
  font-size: 14px;
  line-height: 2.1;
  color: #c7c5be;
}
.about-clients-line .client-item{ white-space: nowrap; }
.about-clients-line .dot{ color: #75736d; margin: 0 6px; }

.about-tags{
  display:flex;
  flex-wrap: wrap;
  gap: 10px;
}

.about-tag{
  font-size: 12px;
  letter-spacing: 0.02em;
  padding: 8px 14px;
  border: 1px solid var(--line-strong);
  border-radius: 20px;
  color: var(--dim);
}

/* ---------------------------------------------
   Mobile: smaller, tighter body copy so long text
   doesn't take up the whole screen. Placed last so
   nothing above can override it.
--------------------------------------------- */
@media (max-width: 640px){
  .work-description{ font-size: 14px; line-height: 1.42; }
  .about-bio{ font-size: 14px; line-height: 1.45; }
  .about-entry .role, .about-entry .org, .about-entry .date{ font-size: 12px; line-height: 1.3; }
  .about-clients-line{ font-size: 12px; line-height: 1.7; }
}

</style>
</head>

        <img class="project-cover-art" src="${p.image}" alt="${p.title}" loading="lazy">
        <span class="project-badge">VIEW</span>
      </span>
      <span class="project-caption">
        <span>${p.title}</span>
        <span>${p.year}</span>
      </span>
    `;

    const cover = item.querySelector(".project-cover");
    cover.style.aspectRatio = String(p.ratio);
    item.ratio = p.ratio;

    frag.appendChild(item);
    items.push(item);
  });

  grid.appendChild(frag);
}

// ------------------------------------------------------------------
// Freeform scatter layout — a jittered masonry: items are bin-packed
// into loose columns (shortest column gets the next item, like normal
// masonry) but with randomized width, horizontal jitter, and vertical
// gap so nothing lines up into a strict grid.
// ------------------------------------------------------------------
function layoutScatter(){
  const containerWidth = grid.clientWidth;
  const colCount = containerWidth < 900 ? 2 : 3;
  const gutter = 56;
  const colWidth = (containerWidth - gutter * (colCount - 1)) / colCount;
  const colHeights = new Array(colCount).fill(0);

  // One drift speed per column (not per item) — items sharing a column
  // always move together, so vertical gaps between them can't close up
  // into an overlap. Speeds are spread evenly across a wider range (with
  // a little jitter) so neighboring columns read as clearly different,
  // rather than being purely random and sometimes landing close together.
  const spread = 0.22;
  const colFactors = Array.from({ length: colCount }, (_, i) => {
    if (reduceMotion) return 0;
    const base = colCount === 1 ? 0 : (i / (colCount - 1) - 0.5) * 2 * spread;
    return base + (Math.random() * 0.06 - 0.03);
  });

  // Shuffle render order slightly so the same title doesn't always land
  // in the same column on repeated layouts.
  const order = items.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }

  order.forEach((i) => {
    const item = items[i];
    const col = colHeights.indexOf(Math.min(...colHeights));

    const widthPct = 0.58 + Math.random() * 0.32; // 58%–90% of column width — bigger minimum, still varied
    const width = colWidth * widthPct;
    const leftover = colWidth - width;

    // Bias the outermost columns toward their outer edge so the grid
    // visibly spans the same width as the header/video above it, while
    // inner columns keep a fully organic random jitter.
    let jitter;
    if (col === 0){
      jitter = leftover * (Math.random() * 0.3); // hugs the left edge
    } else if (col === colCount - 1){
      jitter = leftover * (0.7 + Math.random() * 0.3); // hugs the right edge
    } else {
      jitter = leftover * (Math.random() * 0.7);
    }

    const left = col * (colWidth + gutter) + jitter;
    const gap = 110 + Math.random() * 130; // generous vertical whitespace between covers
    const top = colHeights[col] + (colHeights[col] === 0 ? 0 : gap);

    item.style.width = `${width}px`;
    item.style.left = `${left}px`;
    item.style.top = `${top}px`;
    item.style.transform = "";

    const coverHeight = width / item.ratio;
    const captionHeight = 30;
    item.baseTop = top;
    item.baseHeight = coverHeight + captionHeight;
    item.parallaxFactor = colFactors[col];
    colHeights[col] = top + coverHeight + captionHeight;
  });

  grid.style.height = `${Math.max(...colHeights)}px`;
}

function layoutStacked(){
  items.forEach((item, i) => {
    const widthPct = 78 + Math.random() * 18; // 78%–96% of the column width — some variance instead of a flat 100%
    const pushRight = i % 2 === 0;
    item.style.width = `${widthPct}%`;
    item.style.left = "";
    item.style.top = "";
    item.style.marginLeft = pushRight ? "auto" : "0";
    item.style.marginRight = pushRight ? "0" : "auto";
    item.style.transform = "";
  });
  grid.style.height = "";
}

function applyLayout(){
  const wide = window.innerWidth >= 560;
  const nextMode = wide ? "scatter" : "stacked";
  if (nextMode === mode && nextMode === "stacked") return;
  mode = nextMode;
  grid.classList.toggle("scatter", mode === "scatter");
  grid.classList.toggle("stacked", mode === "stacked");
  if (mode === "scatter") layoutScatter(); else layoutStacked();
}

buildItems();
applyLayout();

let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(applyLayout, 150);
});

// ------------------------------------------------------------------
// Scroll parallax — recompute each item's offset from the viewport
// center on every frame while scrolling, so drift is bounded and
// self-correcting rather than accumulating over a long page.
// ------------------------------------------------------------------
let ticking = false;

function updateParallax(){
  const viewportCenter = window.innerHeight / 2;

  // Watermark drifts on its own, slower and independent of the
  // items/layout mode, so it moves at a visibly different speed.
  if (watermark && !reduceMotion){
    const wRect = watermark.getBoundingClientRect();
    const wDistance = viewportCenter - (wRect.top + wRect.height / 2);

    // In the final stretch of the projects section, add a deliberate
    // upward lift so the watermark visibly rises as the section ends —
    // a cue that you're about to leave it, rather than it just sitting
    // still until the section quietly runs out underneath it.
    let exitLift = 0;
    if (contactSection){
      const contactRect = contactSection.getBoundingClientRect();
      // Start lifting once Get in touch's top edge is about to enter the
      // viewport from below, reach full lift once it's well into view.
      const triggerStart = window.innerHeight;
      const triggerEnd = window.innerHeight * 0.3;
      const progress = Math.min(Math.max((triggerStart - contactRect.top) / (triggerStart - triggerEnd), 0), 1);
      exitLift = -progress * 160;
    }

    watermark.style.transform = `translateY(${wDistance * watermarkFactor + exitLift}px)`;
  }

  // Touch devices have no hover — instead, whichever cover is closest
  // to the viewport center gets the same color-reveal/zoom treatment.
  // Runs regardless of layout mode (scatter or single-column stacked).
  if (isTouchDevice){
    let closestItem = null;
    let closestDist = Infinity;
    items.forEach((item) => {
      const rect = item.getBoundingClientRect();
      const dist = Math.abs(viewportCenter - (rect.top + rect.height / 2));
      if (dist < closestDist){ closestDist = dist; closestItem = item; }
    });
    items.forEach((item) => item.classList.toggle("in-focus", item === closestItem));
  }

  if (mode !== "scatter" || reduceMotion){ ticking = false; return; }
  const gridTop = grid.getBoundingClientRect().top;
  const maxShift = window.innerHeight * 0.5;
  items.forEach((item) => {
    const itemViewportTop = gridTop + item.baseTop;
    const distance = viewportCenter - (itemViewportTop + item.baseHeight / 2);
    const clamped = Math.max(Math.min(distance, maxShift), -maxShift);
    item.style.transform = `translateY(${clamped * item.parallaxFactor}px)`;
  });
  ticking = false;
}

window.addEventListener("scroll", () => {
  if (!ticking){
    requestAnimationFrame(updateParallax);
    ticking = true;
  }
}, { passive: true });

updateParallax();

// ------------------------------------------------------------------
// Mobile nav toggle
// ------------------------------------------------------------------
const navToggle = document.getElementById("navToggle");
const navLinks = document.querySelector(".nav-links");
navToggle?.addEventListener("click", () => navLinks.classList.toggle("open"));
navLinks?.querySelectorAll("a").forEach(a => a.addEventListener("click", () => navLinks.classList.remove("open")));

</script>
</body>
</html>
